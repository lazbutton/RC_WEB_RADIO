############# Logging configuration ##########
logging:
  version: 1
  disable_existing_loggers: false

  formatters:
    generic:
      format: "%(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s] %(message)s"
  
  handlers:
    default:
      formatter: generic
      class : logging.StreamHandler
    interface:
      formatter: generic
      class : logging.StreamHandler
    scheduler:
      formatter: generic
      class : logging.StreamHandler
  
  root:
    level: INFO
    handlers: []
  
  loggers:
    radiotomate:
      level: DEBUG
      handlers: []
      propagate: false
      qualname: radiotomate

    # set to INFO to log SQL queries
    sqlalchemy:
      level: WARNING
      qualname: sqlalchemy
  