server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json;
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";

    location /brand.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /probe/inbox {
        proxy_pass http://192.168.1.100:30128/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /probe/catalog {
        proxy_pass http://192.168.1.100:30127/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /probe/console {
        proxy_pass http://192.168.1.100:30126/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /probe/now {
        proxy_pass http://192.168.1.100:6820/now.json;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /probe/machine {
        proxy_pass http://192.168.1.100:6820/machine.json;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 2s;
    }

    location = /probe/voiceover {
        proxy_pass http://192.168.1.100:6820/voiceover;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_send_timeout 2s;
    }

    location = /probe/voiceover/pcm {
        proxy_pass http://192.168.1.100:6820/voiceover/pcm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /probe/icecast {
        proxy_pass http://192.168.1.100:18000/status-json.xsl;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
    }

    location = /probe/vps {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;
        set $vps_status https://radio.lazbutton.xyz/status-json.xsl;
        proxy_pass $vps_status;
        proxy_ssl_server_name on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 2s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
