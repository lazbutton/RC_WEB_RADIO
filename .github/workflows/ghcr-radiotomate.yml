name: ghcr-radiotomate

on:
  push:
    branches: [main]
    paths:
      - "radiotomate/**"
      - ".github/workflows/ghcr-radiotomate.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push webapps
        uses: docker/build-push-action@v6
        with:
          context: ./radiotomate
          file: ./radiotomate/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ntr-radiotomate:main
            ghcr.io/${{ github.repository_owner }}/ntr-radiotomate:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/button-radiotomate:main
            ghcr.io/${{ github.repository_owner }}/button-radiotomate:${{ github.sha }}
          cache-from: type=gha,scope=radiotomate
          cache-to: type=gha,mode=max,scope=radiotomate
      - name: Build and push playout
        uses: docker/build-push-action@v6
        with:
          context: ./radiotomate/playout
          file: ./radiotomate/playout/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ntr-playout:main
            ghcr.io/${{ github.repository_owner }}/ntr-playout:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/button-playout:main
            ghcr.io/${{ github.repository_owner }}/button-playout:${{ github.sha }}
          cache-from: type=gha,scope=playout
          cache-to: type=gha,mode=max,scope=playout
